# Deploys the install page's relay to Cloudflare's API, relay/worker.ts, from
# main, so that what runs is what anyone can read here. Needs two repository
# secrets: CLOUDFLARE_API_TOKEN, with Account › Workers Scripts › Edit, and
# CLOUDFLARE_ACCOUNT_ID, for the account whose workers.dev subdomain is the one
# in site/install.js.
name: Relay

on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'diva-ravioli/spotify-azuracast'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/relay.test.ts test/install.test.ts
      - run: npx wrangler deploy --config relay/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
      - name: The install page reaches it, at the address it uses
        run: |
          node --input-type=module -e "
            import { RELAY } from './site/install.js'
            import { INSTALL_PAGE } from './relay/worker.ts'
            for (let attempt = 1; ; attempt++) {
              const answer = await fetch(RELAY + '/user/tokens/verify', {
                method: 'OPTIONS',
                headers: { Origin: INSTALL_PAGE, 'Access-Control-Request-Method': 'GET' },
              }).catch(() => null)
              if (answer?.status === 204 && answer.headers.get('access-control-allow-origin') === INSTALL_PAGE) break
              if (attempt === 10) throw new Error('The relay does not answer at ' + RELAY + ': ' + answer?.status)
              await new Promise((resolve) => setTimeout(resolve, 3000))
            }
            console.log('The relay answers at ' + RELAY)
          "
