# Publishes the install page, with the latest release's Worker beside it so the
# page can fetch it. release.yml runs this after each release. It runs from main
# because GitHub's Pages environment doesn't accept deployments from a tag.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release whose files to publish, such as v0.1.3. The latest, if empty."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'diva-ravioli/spotify-azuracast'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: site
        name: The site, and the release's files
        run: |
          # Before the first release the page would have nothing to install.
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq length)
          if [ "$releases" = 0 ]; then
            echo "::notice::No release yet, so there is nothing to publish."
            exit 0
          fi
          mkdir _site
          cp -R site/. _site/
          # release.yml names its release: just after one is created, GitHub can
          # still answer the one before as the latest.
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag."
            exit 1
          fi
          gh release download ${TAG:+"$TAG"} --pattern worker.js --pattern worker.json --dir _site
          echo "ready=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
      - if: steps.site.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        if: steps.site.outputs.ready == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
